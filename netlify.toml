[build]
  command = "npm run build"
  publish = "dist"

# netlify.app-Subdomain dauerhaft auf die eigene Domain umleiten (kein Duplicate Content)
[[redirects]]
  from = "https://wohnform.netlify.app/*"
  to = "https://wohnform-bp.de/:splat"
  status = 301
  force = true

# Gehashte Assets dürfen lange gecacht werden (schnellere Ladezeit → besseres Ranking)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
